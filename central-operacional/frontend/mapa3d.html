<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <title>Mapa 3D Interativo — Shopping Capim Dourado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071d3d;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    .glass-hud {
      background: linear-gradient(145deg, rgba(4, 12, 26, 0.88), rgba(2, 6, 16, 0.80));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(94, 242, 255, 0.32);
      box-shadow: 0 0 0 1px rgba(255, 207, 86, 0.07) inset, 0 18px 50px rgba(0, 0, 0, 0.75), 0 0 26px rgba(94, 242, 255, 0.12);
    }
    .ctrl-btn {
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .ctrl-btn:hover {
      background: rgba(94, 242, 255, 0.16);
      border-color: rgba(94, 242, 255, 0.6);
      color: #effeff;
      transform: translateY(-1px);
    }
    .ctrl-btn.active {
      background: linear-gradient(135deg, rgba(94, 242, 255, 0.28), rgba(246, 185, 59, 0.20));
      border-color: #5ef2ff;
      color: #e6fdff;
      box-shadow: 0 0 16px rgba(94, 242, 255, 0.35);
    }
    .orb, h1, h2 {
      font-family: 'Orbitron', 'Inter', sans-serif !important;
      letter-spacing: 0.08em;
    }
    .stat-num {
      font-family: 'Orbitron', sans-serif;
      color: #9ff6ff;
      text-shadow: 0 0 10px rgba(94, 242, 255, 0.6);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5ef2ff;
      box-shadow: 0 0 10px #5ef2ff;
      animation: lp 1.4s infinite;
    }
    @keyframes lp { 50% { opacity: 0.25; } }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-animate {
      animation: fadeSlideUp 0.22s ease-out forwards;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .leg-off { opacity: 0.35; }
    .leg-off .leg-dot { box-shadow: none !important; background: #475569 !important; }
  </style>
</head>
<body>
  <!-- Contêiner principal 3D -->
  <div id="canvas-container"></div>

  <!-- Cabeçalho & Busca Rápida -->
  <div class="fixed top-4 left-4 z-20 flex flex-col sm:flex-row items-start sm:items-center gap-2.5 max-w-[92vw]">
    <div id="hud-title" class="glass-hud rounded-2xl px-4 py-2.5 flex items-center gap-3 pointer-events-none">
      <div class="w-2.5 h-2.5 rounded-full bg-cyan-300 shadow-[0_0_12px_#5ef2ff]"></div>
      <div>
        <h1 class="text-xs sm:text-sm font-semibold tracking-wider text-cyan-100 uppercase">Shopping Capim Dourado</h1>
        <p class="text-[11px] text-slate-300">Maquete 3D Interativa • Palmas - TO • 38.800,50 m²</p>
      </div>
    </div>

    <!-- Busca Rápida -->
    <div class="relative w-60 sm:w-64">
      <div class="glass-hud rounded-2xl px-3 py-2 flex items-center gap-2">
        <svg class="w-3.5 h-3.5 text-cyan-300 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
        </svg>
        <input
          id="store-search-input"
          type="text"
          placeholder="Buscar loja ou ponto..."
          autocomplete="off"
          class="w-full bg-transparent text-xs text-slate-100 placeholder-slate-400 focus:outline-none"
        />
        <button id="clear-search-btn" type="button" class="hidden text-slate-400 hover:text-cyan-200 text-xs">✕</button>
      </div>
      <div id="search-results" class="hidden mt-1.5 glass-hud rounded-xl overflow-hidden max-h-56 overflow-y-auto no-scrollbar divide-y divide-cyan-200/10"></div>
    </div>
  </div>

  <!-- Controles laterais de Estilo e Efeitos Futuristas -->
  <div class="fixed left-4 top-1/2 -translate-y-1/2 z-20 glass-hud rounded-2xl p-2 hidden sm:flex flex-col gap-1.5">
    <div class="orb text-[9px] text-cyan-300/80 px-1 uppercase" style="letter-spacing:0.25em">Estilo</div>
    <button data-style="neon" class="ctrl-btn px-3 py-2 rounded-xl border border-transparent text-[11px] font-medium text-slate-200 text-left whitespace-nowrap active">Noite Neon</button>
    <button data-style="day" class="ctrl-btn px-3 py-2 rounded-xl border border-transparent text-[11px] font-medium text-slate-200 text-left whitespace-nowrap">Dia</button>
    <div class="h-px bg-cyan-300/20 my-1"></div>
    <div class="orb text-[9px] text-cyan-300/80 px-1 uppercase" style="letter-spacing:0.25em">Efeitos</div>
    <button data-fx="flow" class="ctrl-btn px-3 py-2 rounded-xl border border-transparent text-[11px] font-medium text-slate-200 text-left whitespace-nowrap active">Fluxos</button>
    <button data-fx="drones" class="ctrl-btn px-3 py-2 rounded-xl border border-transparent text-[11px] font-medium text-slate-200 text-left whitespace-nowrap active">Drones</button>
    <button data-fx="beams" class="ctrl-btn px-3 py-2 rounded-xl border border-transparent text-[11px] font-medium text-slate-200 text-left whitespace-nowrap active">Feixes Luz</button>
  </div>

  <!-- Painel Digital Twin (Telemetry) -->
  <div class="fixed left-4 bottom-[84px] z-20 glass-hud rounded-2xl px-4 py-3 w-56 hidden lg:block pointer-events-none">
    <div class="flex items-center gap-2 mb-2"><span class="live-dot"></span><span class="orb text-[10px] text-cyan-200 uppercase">Digital Twin</span></div>
    <div class="grid grid-cols-2 gap-x-3 gap-y-2 text-[10px] text-slate-300">
      <div>Visitantes<div id="st-vis" class="stat-num text-sm">1.860</div></div>
      <div>Estacionamento<div id="st-park" class="stat-num text-sm">64%</div></div>
      <div>Energia<div id="st-en" class="stat-num text-sm">1.190 kW</div></div>
      <div>Espaços<div id="st-sp" class="stat-num text-sm">34</div></div>
    </div>
  </div>

  <!-- Legenda de Categorias -->
  <div id="category-legend" class="fixed right-4 bottom-[84px] z-20 glass-hud rounded-2xl px-3 py-2.5 hidden md:flex flex-col gap-1">
    <div class="orb text-[9px] text-cyan-300/80 px-1 mb-1 uppercase" style="letter-spacing:0.25em">Categorias</div>
    <button type="button" data-cat="moda" class="ctrl-btn px-2 py-1 rounded-lg border border-transparent text-[11px] text-slate-200 text-left flex items-center gap-2">
      <span class="leg-dot inline-block w-2.5 h-2.5 rounded-full" style="background:#e879b9"></span>
      <span>Moda & Beleza</span>
    </button>
    <button type="button" data-cat="food" class="ctrl-btn px-2 py-1 rounded-lg border border-transparent text-[11px] text-slate-200 text-left flex items-center gap-2">
      <span class="leg-dot inline-block w-2.5 h-2.5 rounded-full" style="background:#f0a848"></span>
      <span>Alimentação</span>
    </button>
    <button type="button" data-cat="lazer" class="ctrl-btn px-2 py-1 rounded-lg border border-transparent text-[11px] text-slate-200 text-left flex items-center gap-2">
      <span class="leg-dot inline-block w-2.5 h-2.5 rounded-full" style="background:#a78bfa"></span>
      <span>Lazer & Esportes</span>
    </button>
    <button type="button" data-cat="casa" class="ctrl-btn px-2 py-1 rounded-lg border border-transparent text-[11px] text-slate-200 text-left flex items-center gap-2">
      <span class="leg-dot inline-block w-2.5 h-2.5 rounded-full" style="background:#56cfe1"></span>
      <span>Casa & Varejo</span>
    </button>
    <button type="button" data-cat="vaga" class="ctrl-btn px-2 py-1 rounded-lg border border-transparent text-[11px] text-slate-200 text-left flex items-center gap-2">
      <span class="leg-dot inline-block w-2.5 h-2.5 rounded-full" style="background:#7c8b9e"></span>
      <span>Vagas</span>
    </button>
  </div>

  <!-- Tooltip de Hover -->
  <div id="hover-pill" class="fixed z-30 pointer-events-none hidden px-3 py-1.5 rounded-xl glass-hud text-xs font-medium text-cyan-100 shadow-lg whitespace-nowrap"></div>

  <!-- Cartão Flutuante de Seleção -->
  <div id="selection-card" class="fixed top-4 right-4 z-20 hidden w-72 sm:w-80 glass-hud rounded-2xl p-4 text-slate-100 card-animate">
    <div class="flex items-start justify-between gap-2">
      <div>
        <span id="sel-badge" class="inline-block text-[10px] font-semibold uppercase tracking-widest px-2 py-0.5 rounded-md bg-cyan-400/20 text-cyan-200 border border-cyan-300/35 mb-1.5">1º Pavimento</span>
        <h2 id="sel-title" class="text-base font-bold text-white leading-snug">Loja Selecionada</h2>
      </div>
      <button id="close-card-btn" type="button" aria-label="Fechar" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <p id="sel-desc" class="text-xs text-slate-300 mt-2 leading-relaxed">Operação comercial do mix arquitetônico.</p>
    <div class="mt-3 pt-2.5 border-t border-cyan-200/15 flex items-center justify-between text-[11px] text-slate-300">
      <span id="sel-category">Categoria: Varejo</span>
      <span id="sel-area" class="text-cyan-200 font-medium">Área: Conforme planta</span>
    </div>
    <button id="btn-focus-interior" type="button" class="mt-3 w-full py-2 px-3 rounded-xl bg-cyan-400/20 hover:bg-cyan-400/30 border border-cyan-300/40 text-cyan-100 text-xs font-semibold transition flex items-center justify-center gap-1.5">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
      </svg>
      <span>Aproximar interior 3D</span>
    </button>
  </div>

  <!-- Barra de Controles Inferior -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 max-w-[96vw]">
    <div class="glass-hud rounded-2xl px-2.5 py-2 flex items-center gap-1.5 overflow-x-auto no-scrollbar">
      <button id="btn-overview" class="ctrl-btn px-3 py-2 rounded-xl border border-transparent text-xs font-medium text-slate-200 whitespace-nowrap flex items-center gap-1.5" title="Visão geral da maquete">
        <span>Visão geral</span>
      </button>
      <button id="btn-floor1" class="ctrl-btn px-3 py-2 rounded-xl border border-transparent text-xs font-medium text-slate-200 whitespace-nowrap flex items-center gap-1.5" title="Isolar e aproximar 1º Pavimento">
        <span>Pavimento inferior</span>
      </button>
      <button id="btn-floor2" class="ctrl-btn px-3 py-2 rounded-xl border border-transparent text-xs font-medium text-slate-200 whitespace-nowrap flex items-center gap-1.5" title="Isolar e aproximar 2º Pavimento">
        <span>Pavimento superior</span>
      </button>
      <button id="btn-exploded" class="ctrl-btn active px-3 py-2 rounded-xl border border-transparent text-xs font-medium text-slate-200 whitespace-nowrap flex items-center gap-1.5" title="Visão explodida">
        <span>Visão explodida</span>
      </button>
      <div class="h-5 w-px bg-cyan-200/20 mx-0.5 shrink-0"></div>
      <button id="btn-names" class="ctrl-btn active px-3 py-2 rounded-xl border border-transparent text-xs font-medium text-slate-200 whitespace-nowrap flex items-center gap-1.5" title="Exibir/Ocultar nomes das lojas">
        <span>Nomes das lojas</span>
      </button>
      <button id="btn-pins" class="ctrl-btn px-3 py-2 rounded-xl border border-transparent text-xs font-medium text-slate-200 whitespace-nowrap flex items-center gap-1.5" title="Exibir/Ocultar pins 3D">
        <span>Pins 3D</span>
      </button>
      <button id="btn-rotate" class="ctrl-btn px-3 py-2 rounded-xl border border-transparent text-xs font-medium text-slate-200 whitespace-nowrap flex items-center gap-1.5" title="Girar modelo 360°">
        <span>Girar modelo</span>
      </button>
      <button id="btn-zoom" class="ctrl-btn px-3 py-2 rounded-xl border border-transparent text-xs font-medium text-slate-200 whitespace-nowrap flex items-center gap-1.5" title="Aproximar">
        <span>Aproximar</span>
      </button>
      <button id="btn-transparent" class="ctrl-btn px-3 py-2 rounded-xl border border-transparent text-xs font-medium text-slate-200 whitespace-nowrap flex items-center gap-1.5" title="Modo transparente">
        <span>Modo transparente</span>
      </button>
      <button id="btn-walls" class="ctrl-btn px-3 py-2 rounded-xl border border-transparent text-xs font-medium text-slate-200 whitespace-nowrap flex items-center gap-1.5" title="Ocultar paredes">
        <span>Ocultar paredes</span>
      </button>
      <button id="btn-reset" class="ctrl-btn px-3 py-2 rounded-xl border border-cyan-300/35 text-xs font-semibold text-cyan-200 whitespace-nowrap flex items-center gap-1.5" title="Restaurar visualização">
        <span>Restaurar</span>
      </button>
    </div>
  </div>

  <script>
    // ============================================================================
    // 1. INICIALIZAÇÃO DA CENA 3D, CÉU PROCEDURAL E ESTÚDIO ARQUITETÔNICO
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x071d3d);
    scene.fog = new THREE.FogExp2(0x071d3d, 0.00095);

    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.5, 950);
    const INITIAL_CAM_POS = new THREE.Vector3(-9, 86, 106);
    const INITIAL_TARGET = new THREE.Vector3(-4, 5, 0);
    camera.position.copy(INITIAL_CAM_POS);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.copy(INITIAL_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.485;
    controls.minDistance = 14;
    controls.maxDistance = 245;
    controls.update();

    // Céu procedural em domo com gradiente
    const skyUniforms = {
      top: { value: new THREE.Color(0x020818) },
      mid: { value: new THREE.Color(0x0a264f) },
      bot: { value: new THREE.Color(0x113a6e) }
    };
    const skyDome = new THREE.Mesh(
      new THREE.SphereGeometry(700, 32, 18),
      new THREE.ShaderMaterial({
        uniforms: skyUniforms,
        side: THREE.BackSide,
        depthWrite: false,
        fog: false,
        vertexShader: `varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `
          uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vD;
          void main(){
            float h = max(vD.y, 0.0);
            vec3 c = mix(bot, mid, smoothstep(0.0, 0.28, h));
            c = mix(c, top, smoothstep(0.2, 1.0, h));
            gl_FragColor = vec4(c, 1.0);
          }`
      })
    );
    skyDome.renderOrder = -100;
    scene.add(skyDome);

    // Estrelas no céu noturno
    const starCoords = new Float32Array(1500 * 3);
    for (let i = 0; i < 1500; i++) {
      const u = Math.random() * Math.PI * 2;
      const v = Math.acos(Math.random() * 0.92 + 0.08);
      const r = 640;
      starCoords[i * 3] = r * Math.sin(v) * Math.cos(u);
      starCoords[i * 3 + 1] = r * Math.cos(v);
      starCoords[i * 3 + 2] = r * Math.sin(v) * Math.sin(u);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starCoords, 3));
    const starField = new THREE.Points(starGeo, new THREE.PointsMaterial({
      color: 0xaad4ff, size: 1.7, sizeAttenuation: false, transparent: true, opacity: 1, depthWrite: false, fog: false
    }));
    starField.renderOrder = -99;
    scene.add(starField);

    // ============================================================================
    // 2. ILUMINAÇÃO DE ESTÚDIO E LUZES CALIBRADAS
    // ============================================================================
    const hemiLight = new THREE.HemisphereLight(0xdcebff, 0x2a3b59, 1.15);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff4de, 1.55);
    sunLight.position.set(56, 128, 72);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 20;
    sunLight.shadow.camera.far = 280;
    const dShadow = 88;
    sunLight.shadow.camera.left = -dShadow;
    sunLight.shadow.camera.right = dShadow;
    sunLight.shadow.camera.top = dShadow;
    sunLight.shadow.camera.bottom = -dShadow;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    const rimLight = new THREE.DirectionalLight(0x38e1ff, 0.65);
    rimLight.position.set(-82, 62, -74);
    scene.add(rimLight);

    [
      [-14, 16, 6, 32, 80],
      [36, 15, -4, 30, 78],
      [-36, 20, 4, 28, 60]
    ].forEach(([lx, ly, lz, intensity, dist]) => {
      const pLight = new THREE.PointLight(0xffc66d, intensity, dist, 1.65);
      pLight.position.set(lx, ly, lz);
      scene.add(pLight);
    });

    // ============================================================================
    // 3. CHÃO INFINITO COM GRADE RADAR PULSANTE E ANÉIS HUD ORBITAIS
    // ============================================================================
    const shaderTime = { value: 0 };
    const neonGroundUniforms = {
      uTime: shaderTime,
      uBase: { value: new THREE.Color(0x07152b) },
      uGrid: { value: new THREE.Color(0x2ee6ff) },
      uFog: { value: new THREE.Color(0x071d3d) },
      uGridI: { value: 0.95 }
    };

    const groundMat = new THREE.ShaderMaterial({
      uniforms: neonGroundUniforms,
      extensions: { derivatives: true },
      vertexShader: `varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uBase; uniform vec3 uGrid; uniform vec3 uFog; uniform float uGridI;
        varying vec3 vW;
        float grid(vec2 p,float s){ vec2 q=p/s; vec2 g=abs(fract(q-0.5)-0.5)/fwidth(q); return 1.0-min(min(g.x,g.y),1.0); }
        void main(){
          vec2 p = vW.xz; float d = length(p);
          float big = grid(p, 12.0); float small = grid(p, 3.0);
          float r = mod(uTime * 18.0, 190.0);
          float wave = exp(-pow((d - r) / 3.0, 2.0));
          float fade = exp(-d * 0.011);
          vec3 col = uBase + uGrid * (big * 0.9 + small * 0.10) * uGridI * fade * (0.35 + wave * 2.6);
          col += uGrid * wave * 0.10 * fade * uGridI;
          col = mix(col, uFog, smoothstep(140.0, 430.0, d));
          gl_FragColor = vec4(col, 1.0);
        }`
    });
    const groundPlane = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), groundMat);
    groundPlane.rotation.x = -Math.PI / 2;
    groundPlane.position.y = -5.47;
    scene.add(groundPlane);

    function createHudRing(r, y, dash, gap, color, opacity) {
      const pts = [];
      for (let i = 0; i <= 256; i++) {
        const a = (i / 256) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
      }
      const l = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineDashedMaterial({ color, dashSize: dash, gapSize: gap, transparent: true, opacity })
      );
      l.computeLineDistances();
      l.position.y = y;
      scene.add(l);
      return l;
    }
    const CYAN_HEX = 0x5ef2ff;
    const hudRing1 = createHudRing(98, -5.3, 4, 2.5, CYAN_HEX, 0.75);
    const hudRing2 = createHudRing(108, -5.3, 1.2, 3.2, 0xffd166, 0.55);

    // ============================================================================
    // 4. TEXTURAS PBR E MATERIAIS ARQUITETÔNICOS DE ALTA FIDELIDADE
    // ============================================================================
    function createMarbleTileTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#f3e5d0';

    function createFloatingPin3D(parentGroup, targetHitMesh, heightOffset = 4.6, pinScale = 3.2) {
      const pinSpriteMat = new THREE.SpriteMaterial({ map: pinTargetTex, transparent: true, depthTest: true });
      const pinSprite = new THREE.Sprite(pinSpriteMat);
      const pos = targetHitMesh.parent.position;
      pinSprite.position.set(pos.x, heightOffset, pos.z);
      pinSprite.scale.set(pinScale, pinScale, 1);
      pinSprite.visible = false;

      pinSprite.userData = {
        ...targetHitMesh.userData,
        isPin: true,
        linkedHitMesh: targetHitMesh,
        baseY: heightOffset,
        baseScale: pinScale,
        phase: Math.random() * Math.PI * 2
      };

      parentGroup.add(pinSprite);
      floatingPins.push(pinSprite);
      interactiveMeshes.push(pinSprite);
      return pinSprite;
    }

    function createCutawayStoreUnit(parentGroup, config) {
      const {

      const storeGroup = new THREE.Group();
      storeGroup.position.set(x, 0, z);
      storeGroup.rotation.y = rotY;

      const floorTex = createStoreTopEmblemTexture(name.split('\n')[0], bgHex, textHex, accentHex, badgeShape, interiorType);
      const floorMat = new THREE.MeshStandardMaterial({
        map: floorTex,
        emissiveMap: floorTex,
        emissive: new THREE.Color(0xffffff),
        emissiveIntensity: 0.54,
        roughness: 0.34,
        metalness: 0.06
      });

      const floorGeo = new THREE.BoxGeometry(Math.max(0.25, w - 0.08), 0.24, Math.max(0.25, d - 0.08));
      const floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.position.y = 0.12;
      floorMesh.receiveShadow = true;
      storeGroup.add(floorMesh);

      const t = Math.min(0.2, Math.min(w, d) * 0.12);
      const innerTintColor = new THREE.Color(bgHex).lerp(new THREE.Color(0xffffff), 0.22);
      const innerWallMat = new THREE.MeshStandardMaterial({
        color: innerTintColor,
        emissive: new THREE.Color(bgHex),
        emissiveIntensity: 0.18,
        roughness: 0.42,
        metalness: 0.08
      });
      const brandLedTrimMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(accentHex),
        emissive: new THREE.Color(accentHex),
        emissiveIntensity: 0.72,
        roughness: 0.25,
        metalness: 0.55
      });

      const makeWall = (ww, wh, wd, px, py, pz, sideName) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(ww, wh, wd), matCutawaySlateWall);
        m.position.set(px, py, pz);
        m.castShadow = true;
        m.receiveShadow = true;
        storeGroup.add(m);
        wallMeshes.push(m);

        const linerW = (sideName === 'north' || sideName === 'south') ? Math.max(0.1, ww - t * 1.4) : 0.04;
        const linerD = (sideName === 'east' || sideName === 'west') ? Math.max(0.1, wd - t * 1.4) : 0.04;
        const lx = sideName === 'west' ? px + t / 2 + 0.02 : (sideName === 'east' ? px - t / 2 - 0.02 : px);
        const lz = sideName === 'north' ? pz + t / 2 + 0.02 : (sideName === 'south' ? pz - t / 2 - 0.02 : pz);
        const innerLiner = new THREE.Mesh(new THREE.BoxGeometry(linerW, wh * 0.92, linerD), innerWallMat);
        innerLiner.position.set(lx, py, lz);
        storeGroup.add(innerLiner);
        wallMeshes.push(innerLiner);

        const trim = new THREE.Mesh(new THREE.BoxGeometry(ww + 0.02, 0.08, wd + 0.02), matGoldTrim);
        trim.position.set(px, py + wh / 2 + 0.04, pz);
        storeGroup.add(trim);
        wallMeshes.push(trim);

        const coveLed = new THREE.Mesh(new THREE.BoxGeometry(linerW, 0.07, linerD), brandLedTrimMat);
        coveLed.position.set(lx, py + wh * 0.42, lz);
        storeGroup.add(coveLed);
        wallMeshes.push(coveLed);
      };

      if (frontSide !== 'north') makeWall(w, h, t, 0, h / 2, -d / 2 + t / 2, 'north');
      if (frontSide !== 'south') makeWall(w, h, t, 0, h / 2, d / 2 - t / 2, 'south');
      if (frontSide !== 'west')  makeWall(t, h, d, -w / 2 + t / 2, h / 2, 0, 'west');
      if (frontSide !== 'east')  makeWall(t, h, d, w / 2 - t / 2, h / 2, 0, 'east');

      if (frontSide !== 'none') {
        const glassW = (frontSide === 'north' || frontSide === 'south') ? Math.max(0.1, w - t * 2) : 0.06;
        const glassD = (frontSide === 'east' || frontSide === 'west') ? Math.max(0.1, d - t * 2) : 0.06;
        const glassMesh = new THREE.Mesh(new THREE.BoxGeometry(glassW, h * 0.85, glassD), matGlassStorefront);
        const gx = frontSide === 'east' ? w / 2 - 0.08 : (frontSide === 'west' ? -w / 2 + 0.08 : 0);
        const gz = frontSide === 'south' ? d / 2 - 0.08 : (frontSide === 'north' ? -d / 2 + 0.08 : 0);
        glassMesh.position.set(gx, h * 0.425, gz);
        storeGroup.add(glassMesh);
        wallMeshes.push(glassMesh);

        const sill = new THREE.Mesh(new THREE.BoxGeometry(glassW + 0.04, 0.14, glassD + 0.04), brandLedTrimMat);
        sill.position.set(gx, 0.16, gz);
        storeGroup.add(sill);
        wallMeshes.push(sill);

        const signW = (frontSide === 'north' || frontSide === 'south') ? Math.min(w * 0.86, 6.4) : 0.16;
        const signD = (frontSide === 'east' || frontSide === 'west') ? Math.min(d * 0.86, 6.4) : 0.16;
        const signTex = createStoreFasciaSignTexture(name.split('\n')[0], bgHex, textHex, accentHex);
        const signMat = new THREE.MeshStandardMaterial({
          map: signTex,
          emissiveMap: signTex,
          emissive: new THREE.Color(0xffffff),
          emissiveIntensity: 0.72,
          roughness: 0.22
        });
        const signBoard = new THREE.Mesh(new THREE.BoxGeometry(signW, Math.min(0.48, h * 0.25), signD), signMat);
        signBoard.position.set(gx, h * 0.92, gz);
        storeGroup.add(signBoard);
        wallMeshes.push(signBoard);
      }

      if (interiorType !== 'none') {
        buildStoreInterior3D(storeGroup, interiorType, w, d, h, accentHex);
      }

      const hitMesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      hitMesh.position.y = h / 2;
      hitMesh.userData = {
        selectable: true,
        name,
        floorLabel,
        category,
        areaText,
        description,
        storeDims: { w, d, h },
        highlightMesh: floorMesh,
        baseEmissive: new THREE.Color(0xffffff),
        baseEmissiveIntensity: 0.54
      };
      storeGroup.add(hitMesh);
      interactiveMeshes.push(hitMesh);
      searchableItems.push(hitMesh);

      parentGroup.add(storeGroup);

      if (hasPin) {
        createFloatingPin3D(parentGroup, hitMesh, h + 1.6, pinScale);
      }

      return storeGroup;
    }

    function createParticleFlow(parent, ptsArr, count, colorHex, speed, size) {
      const curve = ptsArr.map((p) => new THREE.Vector3(p[0], p[1], p[2]));
      const lens = [0];
      for (let i = 1; i < curve.length; i++) lens.push(lens[i - 1] + curve[i].distanceTo(curve[i - 1]));
      const total = lens[lens.length - 1];
      const pos = new Float32Array(count * 3), off = new Float32Array(count), spd = new Float32Array(count);
      for (let i = 0; i < count; i++) { off[i] = Math.random(); spd[i] = speed * (0.75 + Math.random() * 0.55); }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({
        size, map: flowGlowTex, color: colorHex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
      });
      const points = new THREE.Points(geo, mat);
      points.frustumCulled = false;
      parent.add(points);
      const v = new THREE.Vector3();
      return {
        points,
        update(t) {
          for (let i = 0; i < count; i++) {
            const u = (off[i] + (t * spd[i]) / total) % 1;
            const d = u * total;
            let k = 1;
            while (k < lens.length - 1 && lens[k] < d) k++;
            const seg = lens[k] - lens[k - 1] || 1;
            v.lerpVectors(curve[k - 1], curve[k], (d - lens[k - 1]) / seg);
            pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
          }
          geo.attributes.position.needsUpdate = true;
        }
      };
    }

    function groupOf(d) {
      const c = (d.category || '').toLowerCase();

      if (/sanit|técnic|tecnic|máquina|maquina|administra|apoio|log[ií]stic|mobilidade|conviv[eê]ncia/.test(c)) return null;
      if (/vaga|dispon/.test(all)) return 'vaga';
      if (/restaur|fast|culin|pizza|frutos|comida|buffet|sandu|massa|churrasc|prato|gastron|caf[eé]|doce|gelato/.test(all)) return 'food';
      if (/entreten|brinqued|parque|academ|evento|imers|lazer|esport/.test(c)) return 'lazer';
      if (/moda|vestu|cal[çc]ado|departamento|joalh|perfum|beleza|megalojas|ótica|otica|acess/.test(all)) return 'moda';
      return 'casa';
    }
    const hexStr = (n) => '#' + n.toString(16).padStart(6, '0');

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawCleanPillLabel(L) {
      const cv = L.canvas, ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
      const col = hexStr(GROUPS[L.group].color);
      ctx.clearRect(0, 0, W, H);

      const padX = 18, padY = 16;
      const boxW = W - padX * 2, boxH = H - padY * 2;
      roundRect(ctx, padX, padY, boxW, boxH, 24);
      ctx.fillStyle = 'rgba(7, 13, 26, 0.90)';
      ctx.fill();

      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
      ctx.stroke();

      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(padX + 26, H / 2, 7.5, 0, Math.PI * 2);
      ctx.fill();

      const main = L.text.split('\n')[0].trim();
      const textAreaW = boxW - 64;
      let fs = 40;
      ctx.font = '600 ' + fs + 'px ' + LABEL_FONT;
      while (ctx.measureText(main).width > textAreaW && fs > 22) {
        fs -= 1;
        ctx.font = '600 ' + fs + 'px ' + LABEL_FONT;
      }

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#f8fafc';
      ctx.fillText(main, padX + 36 + textAreaW / 2, H / 2 + 1);

      L.tex.needsUpdate = true;
    }

      if (!isKiosk) {
        const edges = new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.BoxGeometry(dims.w, dims.h, dims.d)),

    updateVerticalGuideLines();

    // ============================================================================
    // 12. INTERATIVIDADE E CONTROLES
    // ============================================================================
    let targetFloor1Y = FLOOR1_Y;
    let targetFloor2Y = FLOOR2_EXPLODED_Y;
    let pinsVisible = false;
    let autoRotate = false;
    let transparentMode = false;
    let hideWallsMode = false;

    const fxState = { flow: true, drones: true, beams: true };

    function applyVisualTheme(styleKey) {
      const isDay = styleKey === 'day';
      if (isDay) {
        skyUniforms.top.value.setHex(0x2f7fd6);
        skyUniforms.mid.value.setHex(0x8ec5f2);
        skyUniforms.bot.value.setHex(0xcfe0ee);
        scene.background.setHex(0xcfe0ee);
        scene.fog.color.setHex(0xcfe0ee);
        scene.fog.density = 0.0011;
        hemiLight.color.setHex(0xdcebff);
        hemiLight.groundColor.setHex(0x6b6252);
        hemiLight.intensity = 1.25;
        sunLight.color.setHex(0xfff4de);
        sunLight.intensity = 1.65;
        starField.visible = false;
        neonGroundUniforms.uBase.value.setHex(0x2a3441);
        neonGroundUniforms.uGrid.value.setHex(0x1a8fb5);
        neonGroundUniforms.uFog.value.setHex(0xcfe0ee);
        neonGroundUniforms.uGridI.value = 0.45;
      } else {
        skyUniforms.top.value.setHex(0x020818);
        skyUniforms.mid.value.setHex(0x0a264f);
        skyUniforms.bot.value.setHex(0x113a6e);
        scene.background.setHex(0x071d3d);
        scene.fog.color.setHex(0x071d3d);
        scene.fog.density = 0.00095;
        hemiLight.color.setHex(0xdcebff);
        hemiLight.groundColor.setHex(0x2a3b59);
        hemiLight.intensity = 1.15;
        sunLight.color.setHex(0xfff4de);
        sunLight.intensity = 1.55;
        starField.visible = true;
        neonGroundUniforms.uBase.value.setHex(0x07152b);
        neonGroundUniforms.uGrid.value.setHex(0x2ee6ff);
        neonGroundUniforms.uFog.value.setHex(0x071d3d);
        neonGroundUniforms.uGridI.value = 0.95;
      }
      document.querySelectorAll('[data-style]').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.style === styleKey);
      });
    }

    document.querySelectorAll('[data-style]').forEach((btn) => {
      btn.addEventListener('click', () => applyVisualTheme(btn.dataset.style));
    });

    document.querySelectorAll('[data-fx]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.fx;
        fxState[key] = !fxState[key];
        btn.classList.toggle('active', fxState[key]);
        if (key === 'beams') {
          holographicBeamGroup.children.forEach((b) => { b.visible = fxState.beams; });
          beamRotatingRings.forEach((r) => { r.visible = fxState.beams; });
        }
      });
    });

    let camAnimActive = false;
    const desiredCamPos = INITIAL_CAM_POS.clone();
    const desiredCamTarget = INITIAL_TARGET.clone();

    function animateCameraTo(pos, target) {
      desiredCamPos.copy(pos);
      desiredCamTarget.copy(target);
      camAnimActive = true;
    }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let hoveredObj = null;
    let selectedObj = null;
    let pointerDownPos = { x: 0, y: 0 };

    const hoverPill = document.getElementById('hover-pill');
    const selectionCard = document.getElementById('selection-card');
    const selBadge = document.getElementById('sel-badge');
    const selTitle = document.getElementById('sel-title');
    const selDesc = document.getElementById('sel-desc');
    const selCategory = document.getElementById('sel-category');
    const selArea = document.getElementById('sel-area');

    function resolveTargetHit(obj) {
      if (!obj) return null;
      return obj.userData.isPin ? obj.userData.linkedHitMesh : obj;
    }

    function clearHighlight(obj) {
      const target = resolveTargetHit(obj);
      if (!target || !target.userData.highlightMesh) return;
      const mat = target.userData.highlightMesh.material;
      if (mat && mat.emissive) {
        mat.emissive.copy(target.userData.baseEmissive);
        mat.emissiveIntensity = target.userData.baseEmissiveIntensity;
      }
    }

    function applyHighlight(obj, isSelected = false) {
      const target = resolveTargetHit(obj);
      if (!target || !target.userData.highlightMesh) return;
      const mat = target.userData.highlightMesh.material;
      if (mat && mat.emissive) {
        mat.emissive.setHex(isSelected ? 0xffd166 : 0xfff1c2);
        mat.emissiveIntensity = isSelected ? 0.85 : 0.68;
      }
    }

    function selectInteractiveObject(rawHitObj, closeUpInterior = false) {
      const hitObj = resolveTargetHit(rawHitObj);
      if (!hitObj) return;

      if (hitObj.userData.floorLabel.includes('1º Pavimento') && !floor1Group.visible) floor1Group.visible = true;
      if (hitObj.userData.floorLabel.includes('2º Pavimento') && !floor2Group.visible) floor2Group.visible = true;

      if (selectedObj && selectedObj !== hitObj) clearHighlight(selectedObj);
      selectedObj = hitObj;
      applyHighlight(selectedObj, true);

      const data = hitObj.userData;
      selBadge.textContent = data.floorLabel;
      selTitle.textContent = data.name.replace('\n', ' — ');
      selDesc.textContent = data.description;
      selCategory.textContent = data.category;
      selArea.textContent = `Área: ${data.areaText}`;
      selectionCard.classList.remove('hidden');

      const worldPos = new THREE.Vector3();
      hitObj.getWorldPosition(worldPos);
      if (closeUpInterior) {
        animateCameraTo(new THREE.Vector3(worldPos.x - 2.2, worldPos.y + 11.5, worldPos.z + 14.5), worldPos);
      } else {
        animateCameraTo(new THREE.Vector3(worldPos.x - 4, worldPos.y + 22, worldPos.z + 29), worldPos);
      }
    }

    document.getElementById('btn-focus-interior').addEventListener('click', () => {
      if (selectedObj) selectInteractiveObject(selectedObj, true);
    });

    document.getElementById('close-card-btn').addEventListener('click', () => {
      selectionCard.classList.add('hidden');
      if (selectedObj) { clearHighlight(selectedObj); selectedObj = null; }
    });

    const searchInput = document.getElementById('store-search-input');
    const searchResults = document.getElementById('search-results');
    const clearSearchBtn = document.getElementById('clear-search-btn');

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      clearSearchBtn.classList.toggle('hidden', q.length === 0);
      if (!q) { searchResults.classList.add('hidden'); searchResults.innerHTML = ''; return; }
      const matches = searchableItems.filter((item) => {
        return item.userData.name.toLowerCase().includes(q) || item.userData.category.toLowerCase().includes(q);
      }).slice(0, 7);

      if (matches.length === 0) {
        searchResults.innerHTML = `<div class="px-3 py-2 text-xs text-slate-400">Nenhum espaço encontrado.</div>`;
      } else {
        searchResults.innerHTML = matches.map((m, idx) => `
          <button type="button" data-idx="${idx}" class="w-full text-left px-3 py-2 hover:bg-cyan-400/15 transition flex items-center justify-between gap-2">
            <span class="text-xs font-medium text-slate-100 truncate">${m.userData.name.replace('\n', ' ')}</span>
            <span class="text-[10px] text-cyan-300 shrink-0">${m.userData.floorLabel.split(' ')[0]} Pav.</span>
          </button>`).join('');

        searchResults.querySelectorAll('button').forEach((btn) => {
          btn.addEventListener('click', () => {
            selectInteractiveObject(matches[Number(btn.dataset.idx)], true);
            searchResults.classList.add('hidden');
          });
        });
      }
      searchResults.classList.remove('hidden');
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      searchResults.classList.add('hidden');
    });

    function getActiveInteractiveMeshes() {
      return interactiveMeshes.filter((m) => {
        if (!m.visible) return false;
        let p = m.parent;
        while (p) {
          if (!p.visible) return false;
          p = p.parent;
        }
        return true;
      });
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
      camAnimActive = false;
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(getActiveInteractiveMeshes(), false);

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        document.body.style.cursor = 'pointer';
        if (hoveredObj !== hit) {
          if (hoveredObj && resolveTargetHit(hoveredObj) !== selectedObj) clearHighlight(hoveredObj);
          hoveredObj = hit;
          if (resolveTargetHit(hoveredObj) !== selectedObj) applyHighlight(hoveredObj, false);
        }
        hoverPill.textContent = hit.userData.name.replace('\n', ' ');
        hoverPill.style.left = `${Math.min(window.innerWidth - 190, e.clientX + 14)}px`;
        hoverPill.style.top = `${Math.max(12, e.clientY - 28)}px`;
        hoverPill.classList.remove('hidden');
      } else {
        document.body.style.cursor = 'grab';
        if (hoveredObj && resolveTargetHit(hoveredObj) !== selectedObj) clearHighlight(hoveredObj);
        hoveredObj = null;
        hoverPill.classList.add('hidden');
      }
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const moved = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (moved > 6) return;

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(getActiveInteractiveMeshes(), false);
      if (intersects.length > 0) selectInteractiveObject(intersects[0].object, false);
    });

    const viewButtons = ['btn-overview', 'btn-floor1', 'btn-floor2', 'btn-exploded'];
    function setActiveViewButton(activeId) {
      viewButtons.forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('active', id === activeId);
      });
    }

    document.getElementById('btn-overview').addEventListener('click', () => {
      setActiveViewButton('btn-overview');
      floor1Group.visible = true; floor2Group.visible = true;
      targetFloor1Y = FLOOR1_Y; targetFloor2Y = FLOOR2_BASE_Y;
      animateCameraTo(new THREE.Vector3(-10, 68, 106), new THREE.Vector3(-4, 4, -2));
    });

    document.getElementById('btn-floor1').addEventListener('click', () => {
      setActiveViewButton('btn-floor1');
      floor1Group.visible = true; floor2Group.visible = false;
      targetFloor1Y = FLOOR1_Y;
      animateCameraTo(new THREE.Vector3(-8, 56, 86), new THREE.Vector3(-4, 1.5, 0));
    });

    document.getElementById('btn-floor2').addEventListener('click', () => {
      setActiveViewButton('btn-floor2');
      floor1Group.visible = false; floor2Group.visible = true;
      targetFloor2Y = 3.2;
      animateCameraTo(new THREE.Vector3(-34, 32, 46), new THREE.Vector3(-32.5, 3.5, 4.5));
    });

    document.getElementById('btn-exploded').addEventListener('click', () => {
      setActiveViewButton('btn-exploded');
      floor1Group.visible = true; floor2Group.visible = true;
      targetFloor1Y = FLOOR1_Y; targetFloor2Y = FLOOR2_EXPLODED_Y;
      animateCameraTo(INITIAL_CAM_POS, INITIAL_TARGET);
    });

    document.getElementById('btn-names').addEventListener('click', (e) => {
      namesOn = !namesOn;
      e.currentTarget.classList.toggle('active', namesOn);
      refreshLabelVisibility();
    });

    document.getElementById('btn-pins').addEventListener('click', (e) => {
      pinsVisible = !pinsVisible;
      e.currentTarget.classList.toggle('active', pinsVisible);
      floatingPins.forEach((pin) => { pin.visible = pinsVisible; });
    });

    document.getElementById('btn-rotate').addEventListener('click', (e) => {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      controls.autoRotateSpeed = 0.85;
      e.currentTarget.classList.toggle('active', autoRotate);
    });

    document.getElementById('btn-zoom').addEventListener('click', () => {
      const dir = new THREE.Vector3().subVectors(camera.position, controls.target);
      dir.multiplyScalar(0.74);
      if (dir.length() < controls.minDistance) dir.setLength(controls.minDistance);
      animateCameraTo(new THREE.Vector3().addVectors(controls.target, dir), controls.target.clone());
    });

    document.getElementById('btn-transparent').addEventListener('click', (e) => {
      transparentMode = !transparentMode;
      e.currentTarget.classList.toggle('active', transparentMode);
      transparentTargetMaterials.forEach((mat) => {
        mat.transparent = transparentMode;
        mat.opacity = transparentMode ? 0.32 : 1.0;
        mat.needsUpdate = true;
      });
    });

    document.getElementById('btn-walls').addEventListener('click', (e) => {
      hideWallsMode = !hideWallsMode;
      e.currentTarget.classList.toggle('active', hideWallsMode);
      wallMeshes.forEach((w) => { w.visible = !hideWallsMode; });
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      setActiveViewButton('btn-exploded');
      floor1Group.visible = true; floor2Group.visible = true;
      targetFloor1Y = FLOOR1_Y; targetFloor2Y = FLOOR2_EXPLODED_Y;

      namesOn = true;
      document.getElementById('btn-names').classList.add('active');
      refreshLabelVisibility();

      pinsVisible = false;
      document.getElementById('btn-pins').classList.remove('active');
      floatingPins.forEach((pin) => { pin.visible = false; });

      autoRotate = false; controls.autoRotate = false;
      document.getElementById('btn-rotate').classList.remove('active');

      if (transparentMode) {
        transparentMode = false;
        document.getElementById('btn-transparent').classList.remove('active');
        transparentTargetMaterials.forEach((mat) => { mat.transparent = false; mat.opacity = 1.0; mat.needsUpdate = true; });
      }

      if (hideWallsMode) {
        hideWallsMode = false;
        document.getElementById('btn-walls').classList.remove('active');
        wallMeshes.forEach((w) => { w.visible = true; });
      }

      if (selectedObj) { clearHighlight(selectedObj); selectedObj = null; }
      selectionCard.classList.add('hidden');
      animateCameraTo(INITIAL_CAM_POS, INITIAL_TARGET);
    });

    // ============================================================================
    // 13. LOOP DE ANIMAÇÃO
    // ============================================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    let lastTelemetryTick = 0;
    const elStatVis = document.getElementById('st-vis');
    const elStatPark = document.getElementById('st-park');
    const elStatEn = document.getElementById('st-en');

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      shaderTime.value = elapsed;

      const neonPulse = 0.8 + 0.2 * Math.sin(elapsed * 2.2);
      cyanNeonStripMat.color.setRGB(0.37 * neonPulse, 0.95 * neonPulse, 1.0 * neonPulse);
      hudRing1.rotation.y = elapsed * 0.05;
      hudRing2.rotation.y = -elapsed * 0.03;
      beamRotatingRings.forEach((r) => { r.rotation.z += 0.01 * r.userData.spin; });

      particleFlows.forEach((f) => {
        f.points.visible = fxState.flow;
        if (fxState.flow) f.update(elapsed);
      });

      patrolDrones.forEach((d) => {
        d.g.visible = d.trail.visible = fxState.drones;
        if (!fxState.drones) return;
        const x = d.rx * Math.cos(d.a * elapsed + d.ph);
        const z = d.rz * Math.sin(d.b * elapsed + d.ph);
        const y = d.y + 1.8 * Math.sin(elapsed * 0.7 + d.ph);
        const dx = -d.rx * d.a * Math.sin(d.a * elapsed + d.ph);
        const dz = d.rz * d.b * Math.cos(d.b * elapsed + d.ph);
        d.g.position.set(x, y, z);
        d.g.rotation.y = -Math.atan2(dz, dx);
        d.g.rotation.z = 0.12 * Math.sin(elapsed * 1.3 + d.ph);
        d.tp.copyWithin(3, 0, (d.N - 1) * 3);
        d.tp[0] = x; d.tp[1] = y - 0.2; d.tp[2] = z;
        d.trail.geometry.attributes.position.needsUpdate = true;
      });

      if (elapsed - lastTelemetryTick > 0.75 && elStatVis) {
        lastTelemetryTick = elapsed;
        elStatVis.textContent = Math.round(1860 + 140 * Math.sin(elapsed * 0.3)).toLocaleString('pt-BR');
        elStatPark.textContent = Math.round(64 + 7 * Math.sin(elapsed * 0.22)) + '%';
        elStatEn.textContent = Math.round(1190 + 60 * Math.sin(elapsed * 0.4)).toLocaleString('pt-BR') + ' kW';
      }

      floatingPins.forEach((pin) => {
        if (!pin.visible) return;
        const { baseY, baseScale, phase } = pin.userData;
        pin.position.y = baseY + Math.sin(elapsed * 2.4 + phase) * 0.25;
        const pulse = 1 + Math.sin(elapsed * 3.0 + phase) * 0.05;
        pin.scale.set(baseScale * pulse, baseScale * pulse, 1);
      });

      const dist = camera.position.distanceTo(controls.target);
      const labelScale = THREE.MathUtils.clamp(dist / 88, 0.72, 1.25);
      const labelOpacity = dist < 24 ? 0.4 : (dist > 145 ? 0.6 : 0.96);
      for (let i = 0; i < labels.length; i++) {
        const L = labels[i];
        L.sprite.scale.set(L.w * labelScale, L.h * labelScale, 1);
        L.mat.opacity = labelOpacity;
      }

      floor1Group.position.y += (targetFloor1Y - floor1Group.position.y) * 0.08;
      floor2Group.position.y += (targetFloor2Y - floor2Group.position.y) * 0.08;
      updateVerticalGuideLines();

      if (camAnimActive) {
        camera.position.lerp(desiredCamPos, 0.075);
        controls.target.lerp(desiredCamTarget, 0.085);
        if (camera.position.distanceTo(desiredCamPos) < 0.25 && controls.target.distanceTo(desiredCamTarget) < 0.15) {
          camAnimActive = false;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = function () {
      animate();
    };

        #risk-card .rc-score small { font-size: 11px; color: #9fb3c8; }
        #risk-card .rc-bar { height: 6px; border-radius: 9px; background: rgba(255,255,255,.08); overflow: hidden; margin: 6px 0 4px; }
        #risk-card .rc-bar i { display: block; height: 100%; border-radius: 9px; transition: width .35s; }
        #risk-card .rc-tone { font-size: 11px; font-weight: 700; }
        #risk-card ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
        #risk-card li { font-size: 11.5px; background: rgba(255,255,255,.04); border: 1px solid rgba(148,197,255,.12); border-radius: 10px; padding: 7px 9px; }
        #risk-card li em { font-style: normal; font-size: 10px; font-weight: 700; margin-left: 4px; }
        #risk-card .rc-empty { font-size: 11.5px; color: #8fb3c4; margin-top: 10px; }
        #risk-card .rc-actions { display: grid; gap: 7px; margin-top: 12px; }
        #risk-card .rc-actions button { padding: 9px 10px; border-radius: 11px; font-size: 12px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
        #risk-card .rc-act { background: linear-gradient(135deg, #f6c453, #d99a26); color: #1d1405; border: 0; }
        #risk-card .rc-act.undo { background: rgba(94,242,255,.16); color: #dffcff; border: 1px solid #5ef2ff; }
        #risk-card .rc-open { background: transparent; color: #cfe9ff; border: 1px solid rgba(148,197,255,.3); }
        #risk-card .rc-close { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 8px; color: #9fb3c8; background: transparent; border: 0; font-size: 16px; cursor: pointer; }
        #touch-hint { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; pointer-events: none; background: rgba(2,8,20,.35); }
        #touch-hint span { padding: 10px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #effeff; letter-spacing: .04em; }
        body.touch-locked #touch-hint { display: flex; }
        @media (max-width: 640px) {
          body.embedded #hud-title { display: none; }
          body.embedded #selection-card { top: auto; bottom: 150px; left: 12px; right: 12px; width: auto; }
          #risk-panel { top: auto; bottom: 74px; left: 12px; right: 12px; width: auto; padding: 8px 10px; }
          #risk-card { top: auto; bottom: 150px; left: 12px; right: 12px; width: auto; max-height: 46vh; }
        }
      `;
      document.head.appendChild(css);

      const panel = document.createElement('div');
      panel.id = 'risk-panel';
      panel.className = 'glass-hud';
      panel.innerHTML = `
        <div class="rp-top">
          <span class="live-dot"></span>
          <span class="rp-title">RISCO PROJETADO</span>
          <span class="rp-h" id="rp-h">Agora</span>
          <button id="rp-play" title="Reproduzir projeção 0 → 24h">▶</button>
          <button id="rp-layer" class="on" title="Mostrar/ocultar faróis de risco">◉</button>
          <button id="rp-full" title="Tela cheia">⛶</button>
        </div>
        <input id="rp-range" type="range" min="0" max="24" step="1" value="0" aria-label="Horizonte da projeção em horas" />
        <div class="rp-ticks"><span>Agora</span><span>+6h</span><span>+12h</span><span>+18h</span><span>+24h</span></div>`;
      document.body.appendChild(panel);
      if (!EMBED) panel.style.display = 'none';

      const card = document.createElement('div');
      card.id = 'risk-card';
      card.className = 'glass-hud card-animate';
      card.style.display = 'none';
      document.body.appendChild(card);

      const hint = document.createElement('div');
      hint.id = 'touch-hint';
      hint.innerHTML = '<span class="glass-hud">👆 Toque para interagir com o 3D</span>';
      document.body.appendChild(hint);

      const rpRange = panel.querySelector('#rp-range');
      const rpH = panel.querySelector('#rp-h');
      const rpPlay = panel.querySelector('#rp-play');
      const rpLayer = panel.querySelector('#rp-layer');
      const rpFull = panel.querySelector('#rp-full');
      rpRange.addEventListener('input', () => { rpH.textContent = +rpRange.value ? '+' + rpRange.value + 'h' : 'Agora'; send({ type: 'horizon', h: +rpRange.value }); });
      rpPlay.addEventListener('click', () => send({ type: 'play' }));
      rpFull.addEventListener('click', () => send({ type: 'full' }));
      rpLayer.addEventListener('click', () => {
        layerOn = !layerOn;
        rpLayer.classList.toggle('on', layerOn);
        Object.keys(beacons).forEach((id) => { beacons[id].root.visible = layerOn; });
        if (!layerOn) hideCard();
      });

      // ---------- Faróis 3D ----------
      function findMesh(key) {
        const k = key.toUpperCase();
        return interactiveMeshes.find((m) => !m.userData.isPin && m.userData.name && m.userData.name.toUpperCase().includes(k));
      }
      function floorGroupOf(o) {
        let p = o;
        while (p) { if (p === floor1Group || p === floor2Group) return p; p = p.parent; }
        return floor1Group;
      }
      function anchorFor(a) {
        const def = ANCHORS[String(a.name || '').trim().toLowerCase()];
        if (!def) return null;
        if (def.mesh) {
          const m = findMesh(def.mesh);
          if (!m) return null;
          scene.updateMatrixWorld(true);
          const group = floorGroupOf(m);
          const wp = new THREE.Vector3();
          m.getWorldPosition(wp);
          const lp = group.worldToLocal(wp);
          const h = (m.userData.storeDims && m.userData.storeDims.h) || 1.6;
          lp.y += h / 2 + 0.25;
          return { group, pos: lp };
        }
        const group = def.floor === 2 ? floor2Group : floor1Group;
        return { group, pos: new THREE.Vector3(def.x, 0.45, def.z) };
      }

      function drawBadge(b) {
        const a = b.data, tone = toneOf(a), col = TONE_CSS[tone], sel = selectedId === a.id;
        const c = b.canvas, ctx = c.getContext('2d');
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.save();
        roundRect(ctx, 6, 6, c.width - 12, c.height - 12, 46);
        ctx.fillStyle = sel ? 'rgba(10,26,48,0.96)' : 'rgba(4,12,26,0.88)';
        ctx.fill();
        ctx.lineWidth = sel ? 9 : 5;
        ctx.strokeStyle = sel ? '#ffffff' : col;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(58, c.height / 2, 38, 0, Math.PI * 2);
        ctx.fillStyle = col;
        ctx.fill();
        ctx.fillStyle = '#04121f';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 34px Orbitron, Inter, sans-serif';
        ctx.fillText(a.mit ? '✓' : String(a.risk), 58, c.height / 2 + 2);
        ctx.textAlign = 'left';
        let name = String(a.name);
        ctx.font = '700 27px Inter, sans-serif';
        while (ctx.measureText(name).width > c.width - 128 && name.length > 4) name = name.slice(0, -2);
        if (name !== String(a.name)) name = name.replace(/\s+$/, '') + '…';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(name, 108, 50);
        ctx.font = '700 20px Inter, sans-serif';
        ctx.fillStyle = col;
        ctx.fillText(a.mit ? 'AÇÃO SIMULADA' : ('RISCO ' + (state.horizon ? '+' + Math.round(state.horizon) + 'H' : 'AGORA')) + ' · ' + a.n + ' PEND.', 108, 92);
        ctx.restore();
        b.tex.needsUpdate = true;
      }

      function makeBeacon(a) {
        const anchor = anchorFor(a);
        if (!anchor) return null;
        const root = new THREE.Group();
        root.position.copy(anchor.pos);
        const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false });
        const column = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1, 12, 1, true), mat);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(new THREE.RingGeometry(0.7, 1.05, 40), ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = 0.06;
        const canvas = document.createElement('canvas');
        canvas.width = 420; canvas.height = 132;
        const tex = new THREE.CanvasTexture(canvas);
        tex.encoding = THREE.sRGBEncoding;
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
        sprite.center.set(0.5, 0);
        sprite.renderOrder = 40;
        sprite.userData = { riskAreaId: a.id };
        root.add(column, ring, sprite);
        root.visible = layerOn;
        anchor.group.add(root);
        return { root, column, ring, sprite, canvas, tex, mat, ringMat, group: anchor.group, data: a, h: 3 };
      }

      function applyBeacon(b, a) {
        b.data = a;
        const hex = TONE_HEX[toneOf(a)];
        b.mat.color.setHex(hex);
        b.ringMat.color.setHex(hex);
        b.h = 2.2 + (a.mit ? 0.6 : (a.risk / 100) * 6.5);
        drawBadge(b);
      }

      function update(next) {
        state = Object.assign(state, next);
        const seen = {};
        (state.areas || []).forEach((a) => {
          seen[a.id] = true;
          let b = beacons[a.id];
          if (!b) { b = makeBeacon(a); if (!b) return; beacons[a.id] = b; }
          applyBeacon(b, a);
        });
        Object.keys(beacons).forEach((id) => {
          if (!seen[id]) { const b = beacons[id]; b.group.remove(b.root); delete beacons[id]; }
        });
        if (document.activeElement !== rpRange) rpRange.value = Math.round(state.horizon);
        rpH.textContent = state.horizon ? '+' + Math.round(state.horizon) + 'h' : 'Agora';
        rpPlay.textContent = state.playing ? '❚❚' : '▶';
        rpPlay.classList.toggle('on', !!state.playing);
        rpFull.textContent = state.full ? '✕' : '⛶';
        rpFull.title = state.full ? 'Sair da tela cheia' : 'Tela cheia';
        if (selectedId) { if (beacons[selectedId]) renderCard(); else hideCard(); }
      }

      // ---------- Cartão de risco ----------
      function renderCard() {
        const b = beacons[selectedId];
        if (!b) return;
        const a = b.data, tone = toneOf(a), col = TONE_CSS[tone];
        const hz = state.horizon ? '+' + Math.round(state.horizon) + 'H' : 'AGORA';
        card.innerHTML = `
          <button class="rc-close" data-rc="close" aria-label="Fechar">✕</button>
          <div class="rc-eyebrow">MODO FUTURO · CENÁRIO ${hz}</div>
          <h3>${esc(a.name)}</h3>
          <div class="rc-sub">${esc(a.floorName)} · Saúde atual ${a.health}/100</div>
          <div class="rc-score"><b style="color:${col}">${a.risk}</b><small>/100 risco projetado${a.mit ? ' (com ação simulada)' : ''}</small></div>
          <div class="rc-bar"><i style="width:${Math.max(3, a.risk)}%;background:${col}"></i></div>
          <div class="rc-tone" style="color:${col}">● ${TONE_TXT[tone]}${a.mit ? ` · sem a ação seria ${a.raw}/100` : ''}</div>
          ${a.issues && a.issues.length
            ? `<ul>${a.issues.map((o) => `<li>${esc(o.t)}<em style="color:${o.p === 'Crítica' || o.p === 'Alta' ? '#fb7185' : '#fbbf24'}">${esc(o.p)}</em></li>`).join('')}</ul>`
            : '<div class="rc-empty">Nenhuma pendência aberta neste setor.</div>'}
          <div class="rc-actions">
            ${a.n ? `<button class="rc-act ${a.mit ? 'undo' : ''}" data-rc="mit">${a.mit ? '↺ Desfazer ação simulada' : '⚡ Simular envio da equipe'}</button>` : ''}
            <button class="rc-open" data-rc="open">Abrir ocorrências da área →</button>
          </div>`;
        card.style.display = 'block';
      }
      function hideCard() {
        card.style.display = 'none';
        const prev = selectedId;
        selectedId = '';
        if (prev && beacons[prev]) drawBadge(beacons[prev]);
      }
      card.addEventListener('click', (e) => {
        const t = e.target.closest('[data-rc]');
        if (!t) return;
        const b = beacons[selectedId];
        if (t.dataset.rc === 'close') { hideCard(); send({ type: 'focus', id: '' }); }
        if (t.dataset.rc === 'mit' && b) send({ type: 'mitigate', id: b.data.id, on: !b.data.mit });
        if (t.dataset.rc === 'open' && b) send({ type: 'open', id: b.data.id });
      });

      function selectArea(id, fly, fromUser) {
        const b = beacons[id];
        if (!b) { hideCard(); return; }
        const prev = selectedId;
        selectedId = id;
        if (prev && prev !== id && beacons[prev]) drawBadge(beacons[prev]);
        drawBadge(b);
        if (selectedObj) { clearHighlight(selectedObj); selectedObj = null; }
        selectionCard.classList.add('hidden');
        if (!layerOn) { layerOn = true; rpLayer.classList.add('on'); Object.keys(beacons).forEach((k) => { beacons[k].root.visible = true; }); }
        if (!b.group.visible) b.group.visible = true;
        renderCard();
        if (fly) {
          const wp = new THREE.Vector3();
          b.root.getWorldPosition(wp);
          animateCameraTo(new THREE.Vector3(wp.x - 4, wp.y + 24, wp.z + 30), wp);
        }
        if (fromUser) send({ type: 'focus', id });
      }

      // Cartão da loja e cartão de risco não ficam abertos juntos
      new MutationObserver(() => {
        if (!selectionCard.classList.contains('hidden') && card.style.display !== 'none') hideCard();
      }).observe(selectionCard, { attributes: true, attributeFilter: ['class'] });

      // ---------- Clique / toque nos faróis ----------
      const rc = new THREE.Raycaster();
      const pt = new THREE.Vector2();
      let downAt = { x: 0, y: 0 };
      function hitBeacon(e) {
        if (!layerOn) return null;
        const r = renderer.domElement.getBoundingClientRect();
        pt.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        pt.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        rc.setFromCamera(pt, camera);
        const list = Object.keys(beacons).map((k) => beacons[k]).filter((b) => b.root.visible && b.group.visible).map((b) => b.sprite);
        const hit = rc.intersectObjects(list, false)[0];
        return hit ? hit.object.userData.riskAreaId : null;
      }
      renderer.domElement.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY }; }, true);
      renderer.domElement.addEventListener('pointerup', (e) => {
        if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 8) return;
        const id = hitBeacon(e);
        if (id) { e.stopImmediatePropagation(); selectArea(id, false, true); }
      }, true);
      renderer.domElement.addEventListener('pointermove', (e) => {
        if (e.pointerType !== 'mouse') return;
        const id = hitBeacon(e);
        if (!id) return;
        e.stopImmediatePropagation();
        document.body.style.cursor = 'pointer';
        hoverPill.textContent = beacons[id].data.name + ' · risco ' + beacons[id].data.risk + '/100';
        hoverPill.style.left = `${Math.min(window.innerWidth - 220, e.clientX + 14)}px`;
        hoverPill.style.top = `${Math.max(12, e.clientY - 28)}px`;
        hoverPill.classList.remove('hidden');
      }, true);

      // ---------- Animação dos faróis ----------
      const clk = new THREE.Clock();
      (function pulse() {
        requestAnimationFrame(pulse);
        const t = clk.getElapsedTime();
        const dist = camera.position.distanceTo(controls.target);
        const s = THREE.MathUtils.clamp(dist / 70, 0.75, 2.1);
        Object.keys(beacons).forEach((id, i) => {
          const b = beacons[id], tone = toneOf(b.data), sel = id === selectedId;
          const speed = tone === 'bad' ? 4.2 : tone === 'warn' ? 2.4 : 1.4;
          const p = 0.5 + 0.5 * Math.sin(t * speed + i);
          b.column.scale.y = b.h;
          b.column.position.y = b.h / 2;
          b.mat.opacity = (tone === 'good' ? 0.28 : 0.42) + 0.25 * p;
          const rs = 1 + (tone === 'bad' ? 0.9 : tone === 'warn' ? 0.5 : 0.25) * p + (sel ? 0.4 : 0);
          b.ring.scale.set(rs, rs, rs);
          b.ringMat.opacity = 0.85 - 0.55 * p;
          const w = 4.6 * s * (sel ? 1.18 : 1);
          b.sprite.scale.set(w, w * (132 / 420), 1);
          b.sprite.position.y = b.h + 0.15 + (sel ? 0.25 * Math.sin(t * 3) : 0);
        });
      })();

      // ---------- Mensagens do sistema ----------
      window.addEventListener('message', (e) => {
        const m = e.data;
        if (!m || m.source !== 'cdapp') return;
        if (m.type === 'data') {
          update(m);
          if (m.focus && m.focus !== selectedId) selectArea(m.focus, !!m.fly, false);
          else if (!m.focus && selectedId) hideCard();
        }
        if (m.type === 'touchlock') {
          armedHint = !!m.on;
          document.body.classList.toggle('touch-locked', armedHint);
        }
      });
      send({ type: 'ready' });
    })(); } catch (err) { console.error('Camada de risco do Modo Futuro:', err); }

  </script>
</body>
